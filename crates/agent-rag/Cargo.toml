[package]
name = "agent-rag"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
lancedb-store = [
  "dep:arrow-array",
  "dep:arrow-schema",
  "dep:futures",
  "dep:lancedb",
  "dep:tokio",
]

[dependencies]
arrow-array = { version = "58.0.0", optional = true }
arrow-schema = { version = "58.0.0", optional = true }
futures = { version = "0.3", optional = true }
lancedb = { version = "0.31.0", optional = true }
tokio = { version = "1.23", features = ["rt-multi-thread"], optional = true }
