[package]
name = "model-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-core = { path = "../agent-core" }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "multipart", "rustls-tls-native-roots", "stream", "system-proxy"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
