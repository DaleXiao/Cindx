[package]
name = "cindx-desktop"
version = "0.2.34"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "cindx_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["lancedb-store"]
lancedb-store = ["agent-rag/lancedb-store"]
realworld-eval = ["agent-application/collaboration-learning-offline"]

[[bin]]
name = "cindx-agent-realworld-eval"
path = "src/bin/agent_realworld_eval.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-direct-finalizer-gepa-eval"
path = "src/bin/direct_finalizer_gepa_eval.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-workflow-gepa-eval"
path = "src/bin/workflow_gepa_eval.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-workflow-gepa-candidate-probe"
path = "src/bin/workflow_gepa_candidate_probe.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-collaboration-successor-preflight"
path = "src/bin/collaboration_successor_preflight.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-collaboration-successor-authorize"
path = "src/bin/collaboration_successor_authorize.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-collaboration-successor-execute"
path = "src/bin/collaboration_successor_execute.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-preflight"
path = "src/bin/delivery_verification_preflight.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-authorize"
path = "src/bin/delivery_verification_authorize.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-execute"
path = "src/bin/delivery_verification_execute.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-v2-preflight"
path = "src/bin/delivery_verification_v2_preflight.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-v2-authorize"
path = "src/bin/delivery_verification_v2_authorize.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-v2-execute"
path = "src/bin/delivery_verification_v2_execute.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-v3-preflight"
path = "src/bin/delivery_verification_v3_preflight.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-v3-authorize"
path = "src/bin/delivery_verification_v3_authorize.rs"
required-features = ["realworld-eval"]

[[bin]]
name = "cindx-delivery-verification-v3-execute"
path = "src/bin/delivery_verification_v3_execute.rs"
required-features = ["realworld-eval"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-application = { path = "../../../crates/agent-application" }
agent-core = { path = "../../../crates/agent-core" }
agent-graph = { path = "../../../crates/agent-graph" }
agent-harness = { path = "../../../crates/agent-harness" }
agent-memory = { path = "../../../crates/agent-memory" }
agent-mcp = { path = "../../../crates/agent-mcp" }
agent-rag = { path = "../../../crates/agent-rag" }
agent-runtime = { path = "../../../crates/agent-runtime" }
agent-skills = { path = "../../../crates/agent-skills" }
agent-storage = { path = "../../../crates/agent-storage" }
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
model-provider = { path = "../../../crates/model-provider" }
orchestrator = { path = "../../../crates/orchestrator" }
rustls = { version = "0.23.42", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = ["macos-private-api"] }
tempfile = "3.27"
tools = { path = "../../../crates/tools" }
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSImage", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
window-vibrancy = "0.6.0"

[dev-dependencies]
agent-storage = { path = "../../../crates/agent-storage", features = ["test-support"] }
csv = "1"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
