[package]
name = "cindx-desktop"
version = "0.1.39"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "cindx_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-application = { path = "../../../crates/agent-application" }
agent-core = { path = "../../../crates/agent-core" }
agent-graph = { path = "../../../crates/agent-graph" }
agent-memory = { path = "../../../crates/agent-memory" }
agent-mcp = { path = "../../../crates/agent-mcp" }
agent-rag = { path = "../../../crates/agent-rag", features = ["lancedb-store"] }
agent-runtime = { path = "../../../crates/agent-runtime" }
agent-skills = { path = "../../../crates/agent-skills" }
agent-storage = { path = "../../../crates/agent-storage" }
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
model-provider = { path = "../../../crates/model-provider" }
orchestrator = { path = "../../../crates/orchestrator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tools = { path = "../../../crates/tools" }
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
window-vibrancy = "0.6.0"

[dev-dependencies]
csv = "1"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
