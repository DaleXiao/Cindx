[workspace]
resolver = "2"
members = [
  "crates/agent-application",
  "crates/agent-core",
  "crates/agent-eval",
  "crates/agent-graph",
  "crates/agent-harness",
  "crates/agent-memory",
  "crates/agent-mcp",
  "crates/agent-rag",
  "crates/agent-runtime",
  "crates/agent-skills",
  "crates/agent-storage",
  "crates/model-provider",
  "crates/tools",
]
default-members = [
  "crates/agent-application",
  "crates/agent-core",
  "crates/agent-eval",
  "crates/agent-graph",
  "crates/agent-harness",
  "crates/agent-memory",
  "crates/agent-mcp",
  "crates/agent-rag",
  "crates/agent-runtime",
  "crates/agent-skills",
  "crates/agent-storage",
  "crates/model-provider",
  "crates/tools",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0
