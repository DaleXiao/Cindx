name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching the committed version, for example v0.0.5
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Universal macOS release
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate tag and committed version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Audit frontend dependency graph
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Test release source
        run: |
          cargo test --workspace --locked
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          node scripts/check-desktop-dto-contract.mjs
          npm --prefix apps/desktop test
          node scripts/check-desktop-structure.mjs

      - name: Run shipping performance contracts
        timeout-minutes: 10
        run: node scripts/run-quality-gates.mjs --profile shipping-performance --report target/shipping-performance-report.json

      - name: Upload shipping performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cindx-shipping-performance-${{ github.sha }}
          path: target/shipping-performance-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Import optional Apple Developer certificate
        id: apple-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "certificate_configured=false" >> "$GITHUB_OUTPUT"
          echo "notarization_configured=false" >> "$GITHUB_OUTPUT"

          if [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "APPLE_CERTIFICATE is not configured; building an unsigned prerelease."
            exit 0
          fi
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must either both be configured or both be omitted."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/cindx-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/cindx-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$SIGNING_IDENTITY"
          echo "certificate_configured=true" >> "$GITHUB_OUTPUT"
          echo "identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

          if [ -z "$APPLE_ID" ] && [ -z "$APPLE_PASSWORD" ] && [ -z "$APPLE_TEAM_ID" ]; then
            echo "Apple notarization credentials are not configured; building a signed prerelease without notarization."
            exit 0
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID must all be configured for notarization."
            exit 1
          fi
          echo "notarization_configured=true" >> "$GITHUB_OUTPUT"

      - name: Build and publish signed and notarized Universal app
        if: steps.apple-signing.outputs.certificate_configured == 'true' && steps.apple-signing.outputs.notarization_configured == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: ./node_modules/.bin/tauri
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v__VERSION__' }}
          releaseName: Cindx v__VERSION__
          releaseBody: |
            Internal Cindx macOS test build.

            This Universal package supports Apple Silicon and Intel Macs. Builds are signed and notarized only when the repository Apple secrets are configured.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          releaseCommitish: ${{ github.sha }}
          args: --target universal-apple-darwin --bundles app

      - name: Build and publish signed Universal app
        if: steps.apple-signing.outputs.certificate_configured == 'true' && steps.apple-signing.outputs.notarization_configured != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-signing.outputs.identity }}
        with:
          projectPath: apps/desktop
          tauriScript: ./node_modules/.bin/tauri
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v__VERSION__' }}
          releaseName: Cindx v__VERSION__
          releaseBody: |
            Internal Cindx macOS test build.

            This Universal package supports Apple Silicon and Intel Macs. This build is signed but not notarized.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          releaseCommitish: ${{ github.sha }}
          args: --target universal-apple-darwin --bundles app

      - name: Build and publish unsigned Universal app
        if: steps.apple-signing.outputs.certificate_configured != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: ./node_modules/.bin/tauri
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v__VERSION__' }}
          releaseName: Cindx v__VERSION__
          releaseBody: |
            Internal Cindx macOS test build.

            This Universal package supports Apple Silicon and Intel Macs. This build is unsigned and is intended for internal testing.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          releaseCommitish: ${{ github.sha }}
          args: --target universal-apple-darwin --bundles app
