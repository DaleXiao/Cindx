name: CI

on:
  workflow_dispatch:
    inputs:
      performance_baseline_ref:
        description: Git ref to compare against (defaults to the previous commit)
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package test build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve performance baseline
        id: performance-baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_BASELINE: ${{ inputs.performance_baseline_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE_SHA="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -Eq '^0+$'; then
            BASELINE_SHA="$PUSH_BEFORE_SHA"
          elif [ -n "$REQUESTED_BASELINE" ]; then
            BASELINE_SHA="$(git rev-parse --verify --end-of-options "${REQUESTED_BASELINE}^{commit}")"
          else
            BASELINE_SHA="$(git rev-parse --verify HEAD^)"
          fi
          echo "sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out performance baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.performance-baseline.outputs.sha }}
          path: .performance-baseline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Check Rust formatting and lints
        run: sh scripts/check-rust-quality.sh

      - name: Check documentation baseline
        run: node scripts/check-docs.mjs

      - name: Install native build tools
        run: brew install protobuf

      - name: Install baseline frontend dependencies
        working-directory: .performance-baseline/apps/desktop
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Audit frontend dependency graph
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Run paired same-machine performance regression
        timeout-minutes: 15
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: node scripts/run-paired-performance.mjs --baseline-root .performance-baseline --candidate-root . --output-dir target/performance-regression

      - name: Stamp build version
        run: node scripts/stamp-build-version.mjs "$GITHUB_RUN_NUMBER"

      - name: Check stamped documentation version
        run: node scripts/check-docs.mjs

      - name: Test build version carry rules
        run: node --test scripts/versioning.test.mjs

      - name: Test Browser Control v2
        run: node scripts/test-browser-sidecar.mjs

      - name: Test Computer Control
        run: node scripts/test-computer-sidecar.mjs

      - name: Check desktop dependency policy
        run: node scripts/check-desktop-dependency-policy.mjs

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Run deterministic quality gates
        run: node scripts/run-quality-gates.mjs --profile ci-contract --report target/quality-gate-report.json

      - name: Test Tauri bridge
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Run shipping performance contracts
        timeout-minutes: 10
        run: node scripts/run-quality-gates.mjs --profile shipping-performance --report target/shipping-performance-report.json

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cindx-quality-gates-${{ github.sha }}
          path: |
            target/quality-gate-report.json
            target/shipping-performance-report.json
            target/performance-regression/baseline.json
            target/performance-regression/candidate.json
            target/performance-regression/comparison.json
            target/agent-benchmark-report.json
            target/evaluation-v2-foundation.json
            target/memory-evaluation.json
          if-no-files-found: error
          retention-days: 30

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build Apple Silicon test app
        if: github.event_name != 'pull_request'
        working-directory: apps/desktop
        env:
          CINDX_SOURCE_REVISION: ${{ github.sha }}
        run: npm exec tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Probe clean-machine startup
        if: github.event_name != 'pull_request'
        run: |
          APP_PATH="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Cindx.app"
          PROBE_HOME="$RUNNER_TEMP/cindx-clean-home"
          mkdir -p "$PROBE_HOME"
          HOME="$PROBE_HOME" CINDX_DATA_DIR="$PROBE_HOME/data" CINDX_STARTUP_PROBE=1 "$APP_PATH/Contents/MacOS/cindx-desktop"
          test -f "$PROBE_HOME/data/state.sqlite3"
          grep -q "startup probe completed" "$PROBE_HOME/data/startup.log"

          # Probe persistent-state failure: the packaged app must refuse an unsafe in-memory start.
          FAILURE_DATA="$PROBE_HOME/failure-data"
          mkdir -p "$FAILURE_DATA/state.sqlite3"
          if HOME="$PROBE_HOME" CINDX_DATA_DIR="$FAILURE_DATA" CINDX_STARTUP_PROBE=1 "$APP_PATH/Contents/MacOS/cindx-desktop"; then
            echo "Cindx unexpectedly started without a persistent database" >&2
            exit 1
          fi
          grep -q "persistent state unavailable; startup aborted" "$FAILURE_DATA/startup.log"
          ! grep -q "startup probe completed" "$FAILURE_DATA/startup.log"

      - name: Package ad-hoc signed test app
        if: github.event_name != 'pull_request'
        run: |
          APP_PATH="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Cindx.app"
          ARCHIVE_PATH="$RUNNER_TEMP/Cindx-${GITHUB_SHA::8}-macOS-arm64.zip"
          codesign --force --deep --sign - --identifier app.cindx.desktop "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"
          shasum -a 256 "$ARCHIVE_PATH"
          echo "CINDX_TEST_ARCHIVE=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Cindx-${{ github.sha }}-macOS-arm64
          path: ${{ env.CINDX_TEST_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
