name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package test build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Test Tauri bridge
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check desktop structure
        run: node scripts/check-desktop-structure.mjs

      - name: Build Apple Silicon test app
        if: github.event_name != 'pull_request'
        working-directory: apps/desktop
        run: npm exec tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Probe clean-machine startup
        if: github.event_name != 'pull_request'
        run: |
          APP_PATH="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Cindx.app"
          PROBE_HOME="$RUNNER_TEMP/cindx-clean-home"
          mkdir -p "$PROBE_HOME"
          HOME="$PROBE_HOME" CINDX_DATA_DIR="$PROBE_HOME/data" CINDX_STARTUP_PROBE=1 "$APP_PATH/Contents/MacOS/cindx-desktop"
          test -f "$PROBE_HOME/data/state.sqlite3"
          grep -q "startup probe completed" "$PROBE_HOME/data/startup.log"

      - name: Package ad-hoc signed test app
        if: github.event_name != 'pull_request'
        run: |
          APP_PATH="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Cindx.app"
          ARCHIVE_PATH="$RUNNER_TEMP/Cindx-${GITHUB_SHA::8}-macOS-arm64.zip"
          codesign --force --deep --sign - --identifier app.cindx.desktop "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"
          shasum -a 256 "$ARCHIVE_PATH"
          echo "CINDX_TEST_ARCHIVE=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Cindx-${{ github.sha }}-macOS-arm64
          path: ${{ env.CINDX_TEST_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
